<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <!-- Tailwind Link -->
    <link rel="stylesheet" href="../src/output.css" />
  </head>
  <style>
    .ripple::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.25);
      border-radius: inherit;
      transform: scale(0);
      animation: ripple 0.4s ease-out;
    }

    @keyframes ripple {
      to {
        transform: scale(2);
        opacity: 0;
      }
    }
  </style>
  <body class="h-screen w-full bg-zinc-950 text-amber-50">
    <!-- Header Part -->
    <header class="w-full h-auto">
      <nav class="w-full flex justify-between p-3">
        <div class="text-4xl font-[gilroy]">Kanban</div>
        <button
          onclick="
            document.getElementById('taskModal').classList.remove('hidden');
            this.classList.remove('ripple');
            void this.offsetWidth;
            this.classList.add('ripple');
          "
          class="h-10 rounded-md p-2 bg-zinc-800 text-white cursor-pointer relative overflow-hidden"
        >
          New Task
        </button>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="grid grid-cols-3 gap-9 p-4 h-[85%] font-mono">
      <!-- Section 1 -->
      <div id="todo" class="col-span-1 colum">
        <!-- Heading -->
        <div class="heading">
          <div class="">TO DO</div>
          <div class="count">Count</div>
        </div>
      </div>

      <!-- Section 2 -->
      <div id="progress" class="col-span-1 colum">
        <!-- Heading -->
        <div class="heading">
          <div class="">In Progress</div>
          <div class="count">Count</div>
        </div>
      </div>

      <!-- Section 3 -->
      <div id="done" class="col-span-1 colum">
        <!-- Heading -->
        <div class="heading">
          <div class="">Done</div>
          <div class="count">Count</div>
        </div>
      </div>
    </main>

    <!-- Modal -->
    <div
      id="taskModal"
      class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-10 hidden"
    >
      <div
        class="bg-zinc-900 text-white w-full max-w-md rounded-xl p-6 shadow-xl"
      >
        <!-- Header -->
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-xl font-semibold">New Task</h2>
          <button
            onclick="
              document.getElementById('taskModal').classList.add('hidden')
            "
            class="text-zinc-400 hover:text-white text-2xl"
          >
            &times;
          </button>
        </div>

        <!-- Form -->
        <form id="form" class="space-y-4">
          <!-- Title -->
          <div>
            <label
              for="title"
              class="block mb-2 text-sm border-none text-zinc-300"
            >
              Task Title
            </label>
            <input
              id="Inptitle"
              type="text"
              placeholder="Enter task title"
              class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 outline-none focus:border-zinc-500"
            />
          </div>

          <!-- Description -->
          <div>
            <label
              for="dis"
              class="block mb-2 text-sm border-none text-zinc-300"
            >
              Description
            </label>
            <textarea
              id="Inpdis"
              rows="4"
              placeholder="Enter task description"
              class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 outline-none focus:border-zinc-500 resize-none"
            ></textarea>
          </div>

          <!-- Actions -->
          <div class="flex justify-end gap-3 pt-2">
            <button
              type="button"
              onclick="
                document.getElementById('taskModal').classList.add('hidden')
              "
              class="px-4 py-2 rounded-lg border border-zinc-700 hover:bg-zinc-800"
            >
              Cancel
            </button>

            <button
              type="submit"
              id="submitBtn"
              class="px-4 py-2 cursor-pointer rounded-lg bg-white text-black font-medium hover:bg-zinc-200"
            >
              Add Task
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
