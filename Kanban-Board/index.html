<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <!-- Tailwind Link -->
    <link rel="stylesheet" href="../src/output.css" />
  </head>
  <body class="h-screen w-full bg-zinc-950 text-amber-50">
    <!-- Header Part -->
    <header class="w-full h-auto">
      <nav class="w-full flex justify-between p-3">
        <div class="text-4xl font-[gilroy]">Kanban</div>
        <button class="h-10 rounded-md p-2 bg-zinc-800">New Task</button>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="grid grid-cols-3 gap-9 p-4 h-[85%] font-mono">
      <!-- Section 1 -->
      <div id="todo" class="col-span-1 colum">
        <!-- Heading -->
        <div class="heading">
          <div class="">TO DO</div>
          <div class="">Count</div>
        </div>
        <!-- Tasks -->
        <div class="task-column">
          <div class="task" draggable="true">
            <div>
              <h2 class="title">Task 1</h2>
              <p class="para">Discription</p>
            </div>
            <button class="button">Delete</button>
          </div>
        </div>
      </div>

      <!-- Section 2 -->
      <div id="progress" class="col-span-1 colum">
        <!-- Heading -->
        <div class="heading">
          <div class="">In Progress</div>
          <div class="">Count</div>
        </div>
      </div>

      <!-- Section 3 -->
      <div id="done" class="col-span-1 colum">
        <!-- Heading -->
        <div class="heading">
          <div class="">Done</div>
          <div class="">Count</div>
        </div>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
