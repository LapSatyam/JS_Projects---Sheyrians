<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Editor</title>
    <!-- Tailwind Link -->
    <link rel="stylesheet" href="../src/output.css" />
    <!-- Icon CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body class="h-screen w-full bg-zinc-950 text-zinc-200 p-2">
    <header class="h-fit w-full flex justify-center items-center gap-4 mt-5">
      <label
        for="input-img"
        class="btn bg-zinc-100 text-zinc-900 hover:bg-white active:bg-zinc-50"
      >
        Choose Image
        <input type="file" name="image" id="input-img" hidden />
      </label>

      <button
        class="btn bg-red-600 text-zinc-50 hover:bg-red-700 hover:text-white active:bg-red-700"
        id="resetBtn"
      >
        Reset
      </button>

      <button
        class="btn bg-green-500 text-zinc-50 hover:bg-green-600/90 hover:text-white"
        id="downloadBtn"
      >
        Download
      </button>
    </header>

    <main class="w-full h-[90%] flex gap-5 mt-5 p-6">
      <!-- Left Side -->
      <div
        class="w-full h-full bg-zinc-800/80 flex justify-center items-center"
      >
        <div
          id="placeholder"
          class="w-full h-full flex justify-center flex-col"
        >
          <i class="ri-image-line text-9xl self-center"></i>
          <div class="text-xl self-center">No Image Added</div>
        </div>
        <canvas
          id="canvas-img"
          class="max-w-[90%] max-h-[80vh] hidden"
        ></canvas>
      </div>

      <!-- Right Side -->
      <div class="w-[40%] h-full bg-zinc-800/80">
        <div class="filters w-full h-full"></div>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
