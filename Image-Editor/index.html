<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Editor</title>
    <!-- Tailwind Link -->
     <link rel="stylesheet" href="../src/output.css">
</head>
<body class="h-screen w-full bg-zinc-900 text-zinc-200">
    <header class="h-fit w-full flex justify-center items-center gap-4">
        <label for="input-img">
            Choose Image
            <input type="file" name="image" id="input-img" hidden>
        </label>

        <button class="btn">
            Reset
        </button>
        
        <button class="btn">
            Download
        </button>
    </header>

    <Main>
        <!-- Left Side -->
        <div class="bg-red-400"></div>

        <!-- Right Side -->
        <div class="bg-blue-400"></div>
    </Main>
</body>
</html>
